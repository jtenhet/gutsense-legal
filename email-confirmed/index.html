<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email confirmed — GutSense</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%;
      background: #FBFAF7;
      color: #1F1F1A;
      font-family: 'Source Sans 3', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 17px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }
    .logo {
      font-family: 'Fraunces', Georgia, serif;
      font-size: 18px;
      color: #1F1F1A;
      position: absolute;
      top: 24px;
      left: 24px;
      text-decoration: none;
    }
    .container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 64px 24px 48px;
      max-width: 480px;
      margin: 0 auto;
      text-align: center;
    }
    .check {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #6BB281;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 28px;
      color: #FFFFFF;
      font-size: 30px;
      line-height: 1;
    }
    h1 {
      font-family: 'Fraunces', Georgia, serif;
      font-weight: 500;
      font-size: 30px;
      line-height: 1.2;
      margin-bottom: 14px;
      letter-spacing: -0.01em;
    }
    p {
      color: #5C5C56;
      margin-bottom: 24px;
      max-width: 380px;
    }
    .button {
      display: inline-block;
      background: #6BB281;
      color: #FFFFFF;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 999px;
      font-weight: 600;
      transition: opacity .15s;
      margin-bottom: 4px;
    }
    .button:hover { opacity: .88; }
    .hint {
      font-size: 14px;
      color: #8C8C84;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <a href="https://jtenhet.github.io/gutsense-legal/" class="logo">GutSense</a>
  <div class="container">
    <div class="check" id="mark">✓</div>
    <h1 id="title">Email confirmed</h1>
    <p id="body">Your GutSense account is all set. Open the app on your phone and sign in to start logging.</p>
    <a href="#" class="button" id="openApp">Open GutSense</a>
    <p class="hint" id="hint">If the button doesn't open the app, switch back to GutSense on your phone and sign in with the email and password you just used.</p>
  </div>
  <script>
    // Supabase (implicit flow) redirects here with the session in the URL
    // fragment on success, or with an error fragment when the one-time link was
    // already spent — a double-tap, or an email-security scanner pre-fetching
    // the link. In the error case the FIRST hit already confirmed the account,
    // so we never tell the user it failed; we just point them at signing in.
    // Either way we forward the fragment to the app, which handles both.
    var fragment = window.location.hash || '';
    // Match the actual error PARAM, not a stray "error" substring that could
    // appear inside a base64 access_token.
    var params = new URLSearchParams(fragment.replace(/^#/, ''));
    var isError = params.has('error') || params.has('error_code') || params.has('error_description');
    var deepLink = 'gutsense://confirm-email' + fragment;
    document.getElementById('openApp').href = deepLink;

    if (isError) {
      // Don't claim "confirmed ✓" when this particular hit didn't confirm.
      document.getElementById('title').textContent = 'Almost there';
      document.getElementById('body').textContent =
        'This confirmation link has already been used, which usually means your account is confirmed. Open GutSense and sign in to start logging.';
      document.getElementById('hint').textContent =
        "If signing in says your email isn't confirmed yet, use “Resend confirmation email” on the sign-in screen.";
    }

    // Best-effort auto-handoff to the app. If no handler is installed (desktop,
    // wrong browser, app uninstalled), this silently fails and the copy +
    // button remain visible. Only auto-open on the success path so an error
    // fragment doesn't yank the user into the app before they read the note.
    if (!isError) {
      setTimeout(function () { window.location.href = deepLink; }, 600);
    }
  </script>
</body>
</html>
